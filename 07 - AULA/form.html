<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="">

        <!-- fieldset - segmenta visualmente o formulário -->
        <fieldset>
            <!-- legends - titulo de segmento -->
            <legend> Dados Pessoais</legend>

            <!-- caixinha de nome -->
            <label for="nome"> Nome: </label>
            <input type="text" name="nome" id="nome">
            <!-- fim caixinha nome -->

            <br><br>

            <!-- Caixinha data de nascimento -->
            <label for="">Data de nascimento:</label>
            <!-- date - apenas data -->
            <input type="date" name="" id="">
            <!-- time - apenas hora -->
            <input type="time">
            <!-- datetime-local - data e hora juntos -->
            <input type="datetime-local">
            <!-- Fim caixinha data de nascimento -->
            
            <br><br>

            <!-- Caixinha de números -->
             <label for="filhos"> Quantidade de filho: </label>
             <input type="number" name="filhos" id="filhos" min="-3"
             max="301" step="0.7">
            <!-- Fim caixinha de números -->
        </fieldset>
 
 
    </form>
</body>
</html>
