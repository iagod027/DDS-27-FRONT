<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <header>
        <h1> TRABALHANDO COM INPUTS </h1>
    </header>

    <!-- INPUT -->
    <main>
        <h2> Formulário de cadastro </h2>
        
        <!-- input - coleta informações do usuário -->
        <!-- form - englobar os campos do formulário -->
        <!-- action - para onde vão as informações preenchidas -->
        <!-- method - forma de como vão as informações -->
        <form action="" method="">

            <!-- label - texto de apoio para guiar o input -->
            <!-- label sem input -->
            <label for="nomeCompleto">NOME COMPLETO: </label>
            <!-- text - caracter em geral -->
            <!-- name - usado para identificar o input quando enviar os dados -->
            <!-- id - identificação daquele elemento html -->
            <input type="text" name="nomeCompleto" id="nomeCompleto">

            <br> <br>

            <!-- forma 2 - input dentro label -->
            <label>
                SENHA:
                <!-- password - para senhas -->
                <input type="password" name="senha" id="senha">
            </label>
        </form>
    </main>
     
    <footer>
        <p>EUKHI FIZZ</p>
    </footer>

</body>
</html>
