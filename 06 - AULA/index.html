<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Illegal Market</title>
</head>
<body>
    <!-- TABELAS -->
    <header>
        <h1>Tabelas top</h1>
    </header>

    <main>
        <h2> DROGAS </h2>
        <!-- table - CRIAÇÃO DA TABELA -->
        <!-- border - DIMENSIONA A BORDA DA TABELA -->
         <table border="5">
            <!-- thead - CABEÇALHO DA TABELA -->
            <thead>
                <!-- tr - CRIAÇÃO DE UMA LINHA DA TABELA -->
                <tr>
                    <!-- th - COLUNA DE UM CABEÇALHO -->
                    <th> ID </th>
                    <th> NOME </th>
                    <th> QUANTIDADE </th>
                    <th> PREÇO </th>
                    <th> CATEGORIA </th>
                </tr>
            </thead>
            <!-- tbody - CORPO DA TABELA -->
             <tbody>
                <tr>
                    <!-- td - CÉLULA DA LINHA DO CORPO -->
                    <td> 01 </td>
                    <td> Skunk </td>
                    <td> 5g </td>
                    <td> $ 25 </td>
                    <td> Sativa </td>
                </tr>
                <!-- tr*2>td*5 - para criar 2 linhas e suas 5 colunas de uma vez só -->
                <tr>
                    <td> 02 </td>
                    <td> Bala </td>
                    <td> 3 </td>
                    <td> $ 45 </td>
                    <td> Ecstasy </td>
                </tr>
                <tr>
                    <td> 03 </td>
                    <td> LSD </td>
                    <td> 200ug </td>
                    <td> $ 30 </td>
                    <td> Alucinógeno </td>
                </tr>
                <tr>
                    <td> 04 </td>
                    <!-- colspan - DIZ QUANTAS COLUNAS A CÉLULA VAI OCUPAR -->
                    <td colspan="2">Kit Lombra 1</td>
                    <td> $ 40 </td>
                    <!-- rowspan - DIZ QUANTAS LINHAS A CÉLULA VAI OCUPAR -->
                    <td rowspan="2"> Salva corre </td>
                </tr>
                 <tr>
                    <td> 04 </td>
                    <td colspan="2">Kit Lombra 2</td>
                    <td> $ 60 </td>
                </tr>
             </tbody>
             <!-- tfoot - RODAPÉ DA TABELA -->
             <tfoot>
                <tr>
                    <td colspan="5"> Tabela feita por: MF DRUGS</td>
                </tr>
             </tfoot>
         </table>
    </main>

    <footer>
        <p> Segue nóis </p>
    </footer>
</body>
</html>
